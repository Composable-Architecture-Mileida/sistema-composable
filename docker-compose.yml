services:
  # 1. BASE DE DATOS (PostgreSQL)
  database:
    image: postgres:16-alpine
    container_name: composable-db
    environment:
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: composable_auth
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. BACKEND (NestJS - Auth Microservice)
  auth-service:
    build:
      context: ./sistema-composable-backend/auth-microservicio
      dockerfile: Dockerfile
    container_name: auth-api
    environment:
      DATABASE_URL: "postgresql://dev_user:dev_password@database:5432/composable_auth?schema=public"
    depends_on:
      - database
    ports:
      - "3000:3000"

  # 3. FRONTEND (Angular 18)
  frontend:
    build:
      context: ./sistema-composable
      dockerfile: Dockerfile
    container_name: angular-app
    ports:
      - "4200:4000" # Ajustar según si usas SSR o CSR
    depends_on:
      - auth-service

volumes:
  postgres_data: